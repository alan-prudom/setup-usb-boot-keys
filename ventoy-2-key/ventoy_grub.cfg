# ==============================================================================
# Ventoy Custom Menu Configuration (Press F6 at Ventoy Screen)
# Target Device: Ventoy 2 (/dev/sdb)
# ==============================================================================

menuentry "🟢 Boot Installed Ubuntu 22.04 LTS (Ubuntu-USB-Ventoy on /dev/sdb3)" --class=ubuntu {
    insmod part_msdos
    insmod ext2
    search --no-floppy --fs-uuid --set=root e0d8ad1a-410b-4245-9192-66d2a16077b9
    configfile /boot/grub/grub.cfg
}

menuentry "🟢 Direct Linux Kernel Boot - Safe Graphics (nomodeset)" --class=ubuntu {
    insmod part_msdos
    insmod ext2
    search --no-floppy --fs-uuid --set=root e0d8ad1a-410b-4245-9192-66d2a16077b9
    linux /boot/vmlinuz root=UUID=e0d8ad1a-410b-4245-9192-66d2a16077b9 ro nomodeset
    initrd /boot/initrd.img
}

menuentry "🟢 Direct Linux Kernel Boot - Text Console (systemd.unit=multi-user.target)" --class=ubuntu {
    insmod part_msdos
    insmod ext2
    search --no-floppy --fs-uuid --set=root e0d8ad1a-410b-4245-9192-66d2a16077b9
    linux /boot/vmlinuz root=UUID=e0d8ad1a-410b-4245-9192-66d2a16077b9 ro systemd.unit=multi-user.target
    initrd /boot/initrd.img
}

menuentry "🪟 Boot Windows (Internal Disk /dev/sda)" --class=windows {
    insmod part_msdos
    insmod ntfs
    insmod ntldr
    search --no-floppy --file --set=root /bootmgr
    ntldr /bootmgr
}

menuentry "<-- Return to Ventoy ISO Menu [Esc]" --class=vtoyret VTOY_RET {
    echo "Returning to Ventoy..."
}
